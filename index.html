<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
       name="description"
       content="Aplicación dinámica para organizar tareas diarias"
    />
    <title>Mi Día | Lista de tareas</title>
    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
    <header class="app-header">
        <p class="app-header__eyebrow">Organizador personal</p>
        <h1> Mi Día</h1>
        <p class="app-header_subtitle">
            Organiza tus tareas, simplifica tu día.
        </p>
    </header>

    <main class="app-main">
    <section class="task-panel" aria-labelledby="task-panel-title">
        <header class="task-panel__header">
            <h2 id="task-panel-title">Mis tareas</h2>
            <p>¿Qué necesitas hacer hoy?</p>
        </header>

        <form class="task-form">
            <label for="new-task">Nueva tarea</label>

            <div class="task-form__controls">
                <input
                    type="text"
                    id="new-task"
                    name="new-task"
                    placeholder="Escribe una nueva tarea..."
                    autocomplete="off"
                />

                <button type="submit">Añadir tarea</button>
            </div>
        </form>

        <div class="task-summary" role="group" aria-label="Resumen de tareas">
            <p><strong id="total-tasks">0</strong> tareas</p>
            <p><strong id="pending-tasks">0</strong> pendientes</p>
            <p><strong id="completed-tasks">0</strong> completadas</p>
        </div>

        <nav class="task-filters" aria-label="Filtrar tareas">
            <button 
               type="button" 
               class="task-filters__button task-filters__button--active"
               data-filter="all"
            >
                Todas
            </button>

            <button 
               type="button" 
               class="task-filters__button"
               data-filter="pending"
            >
                Pendientes
            </button>

            <button 
               type="button" 
               class="task-filters__button"
               data-filter="completed"
            >
                Completadas
            </button>
        </nav>

        <ul class="task-list" aria-label="Lista de tareas">
            
        </ul>

        <div class="task-actions">
            <button 
              type="button" 
              class="button button--secondary"
              id="delete-completed"

            >
                Eliminar completadas
            </button>

            <button 
              type="button" 
              class="button button--danger"
              id="delete-all"
            >
                Eliminar todas
            </button>
        </div>
    </section>
</main>

<footer class="app-footer">
    <p>Mi Día . Organiza hoy, avanza mañana.</p>
</footer>
    <script src="./js/app.js"></script>

</body>
</html>
